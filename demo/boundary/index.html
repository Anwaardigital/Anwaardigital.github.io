<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boundary – Live cricket scores</title>
<style>
:root{--bg:#f4f6f3;--surface:#fff;--ink:#14231b;--muted:#5d6d63;--line:#dfe5df;--accent:#0d7a4f;--live:#d6264a;--chip:#e6ece6}
@media (prefers-color-scheme:dark){:root{--bg:#0e1712;--surface:#16231b;--ink:#eaf2ec;--muted:#93a69a;--line:#25362c;--accent:#3fd18c;--live:#ff5a7a;--chip:#1f3026}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
header{padding:16px 4px 8px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.02em}.logo span{color:var(--accent)}
.sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.tab{border:0;background:var(--chip);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:flex;gap:8px;margin:6px 0 14px}
.nav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer}
.nav .date{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:700}
.league{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.league h2{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.match{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.fav{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;padding:0}.fav.on{color:#e8a600}
.teams{flex:1;min-width:0}
.t{display:flex;align-items:center;gap:8px;padding:2px 0}
.t img{width:20px;height:14px;object-fit:cover;border-radius:2px;flex:none}
.t b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-variant-numeric:tabular-nums;font-size:14px}
.st{font-size:12px;color:var(--muted);margin-top:4px}
.status{min-width:70px;text-align:right;font-size:13px;color:var(--muted)}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700}
.badge.live{background:var(--live);color:#fff}.badge.fin{background:var(--chip);color:var(--ink)}
.empty,.err{text-align:center;color:var(--muted);padding:30px 10px}
.err{color:var(--live)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
</style>
</head>
<body>
<div style="background:#0d7a4f;color:#fff;text-align:center;padding:10px 12px;font-size:14px;font-weight:600">DEMO VERSION — Sample match data. Real version shows live scores via CricketData.org. | <a href="https://anwaardigital.com/" style="color:#fff;text-decoration:underline">Anwaar Digital</a> — Aisi website banwane ke liye rabta karen!</div>
<div class="wrap">
<header><div class="logo">Bound<span>ary</span></div><div class="sub" id="upd">Loading scores…</div></header>
<div class="tabs" role="group" aria-label="Filter matches">
  <button class="tab" data-f="all" aria-pressed="true">All</button>
  <button class="tab" data-f="live" aria-pressed="false">Live</button>
  <button class="tab" data-f="finished" aria-pressed="false">Finished</button>
  <button class="tab" data-f="scheduled" aria-pressed="false">Scheduled</button>
  <button class="tab" data-f="fav" aria-pressed="false">Favourites</button>
</div>
<div class="nav">
  <button id="prev" aria-label="Previous day">‹</button><div class="date" id="date"></div><button id="next" aria-label="Next day">›</button>
</div>
<div id="err" class="err" hidden></div>
<div id="list"></div>
<p class="note">DEMO: Sample data for demonstration. Real version: live scores via CricketData.org, updated every few minutes.</p>
</div>
<script>
var DAY=864e5,offset=0,filter="all",matches=[],favs={},updated=0;
try{favs=JSON.parse(localStorage.getItem("favs")||"{}")}catch(e){}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function stat(m){return m.matchEnded?"finished":(m.matchStarted?"live":"scheduled")}
function when(m){return m.dateTimeGMT?new Date(m.dateTimeGMT+"Z"):null}
function scoreFor(m,team){var o=[];(m.score||[]).forEach(function(s){if(String(s.inning||"").toLowerCase().indexOf(String(team).toLowerCase())===0)o.push(s.r+"/"+s.w+" ("+s.o+")")});return o.join(" & ")}
function imgFor(m,team){var i=(m.teamInfo||[]).filter(function(t){return t.name===team})[0];return i&&/^https?:\/\//.test(i.img||"")?i.img:""}
function render(){
  var day=new Date(Date.now()+offset*DAY);
  document.getElementById("date").textContent=DOW[day.getDay()]+", "+day.getDate()+" "+MON[day.getMonth()];
  var groups={};
  matches.forEach(function(m){
    var d=when(m);if(!d||d.toDateString()!==day.toDateString())return;
    var s=stat(m);
    if(filter==="fav"){if(!favs[m.id])return}else if(filter!=="all"&&s!==filter)return;
    var g=(m.matchType||"Match").toUpperCase();(groups[g]=groups[g]||[]).push(m);
  });
  var out="";
  Object.keys(groups).forEach(function(g){
    out+='<section class="league"><h2>'+esc(g)+'</h2>';
    groups[g].sort(function(a,b){return when(a)-when(b)}).forEach(function(m){
      var s=stat(m),t=m.teams||["",""],d=when(m);
      var badge=s==="live"?'<span class="badge live">LIVE</span>':s==="finished"?'<span class="badge fin">Finished</span>':esc(d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
      out+='<div class="match"><button class="fav'+(favs[m.id]?" on":"")+'" data-id="'+esc(m.id)+'" aria-label="Favourite">'+(favs[m.id]?"★":"☆")+'</button><div class="teams">';
      [0,1].forEach(function(i){var im=imgFor(m,t[i]);out+='<div class="t">'+(im?'<img src="'+esc(im)+'" alt="" loading="lazy">':"")+'<b>'+esc(t[i])+'</b><span class="score">'+esc(scoreFor(m,t[i]))+'</span></div>'});
      out+='<div class="st">'+esc(m.status)+'</div></div><div class="status">'+badge+'</div></div>';
    });
    out+="</section>";
  });
  document.getElementById("list").innerHTML=out||'<div class="empty">No matches for this day and filter.</div>';
}
function load(){
  fetch("matches.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw new Error(j.error||"error");
    matches=j.data||[];updated=j.updated*1000;
    document.getElementById("err").hidden=true;
    document.getElementById("upd").textContent="Updated "+new Date(updated).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    render();
  }).catch(function(){
    var e=document.getElementById("err");e.hidden=false;e.textContent="Couldn’t load scores. Retrying shortly.";
    document.getElementById("upd").textContent="Offline";render();
  });
}
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){filter=t.dataset.f;document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed",x===t)});render()}});
document.getElementById("prev").onclick=function(){offset--;render()};
document.getElementById("next").onclick=function(){offset++;render()};
document.getElementById("list").onclick=function(e){var b=e.target.closest(".fav");if(!b)return;var id=b.dataset.id;if(favs[id])delete favs[id];else favs[id]=1;try{localStorage.setItem("favs",JSON.stringify(favs))}catch(x){}render()};
load();setInterval(load,60000);
</script>
</body>
</html>
